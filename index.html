<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EtalaseKu, katalog produk dengan desain modern dan mudah digunakan." />
    <title>EtalaseKu</title>
    <script>
      var storedTheme = null
      try {
        storedTheme = window.localStorage.getItem('katalog:theme')
      } catch (error) {
        storedTheme = null
      }
      var theme =
        storedTheme === 'gelap' || storedTheme === 'terang'
          ? storedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'gelap'
            : 'terang'
      document.documentElement.dataset.theme = theme
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
